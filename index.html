<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f13" />
    <meta
      name="description"
      content="Atlas interactivo y no oficial de las rutas de El Señor de los Anillos. Proyecto fan sin ánimo de lucro."
    />
    <title>Atlas de la Tierra Media</title>
  </head>
  <body data-panel="none">
    <div class="app">
      <main id="map" class="map" aria-label="Mapa de la Tierra Media"></main>
      <div class="vignette" aria-hidden="true"></div>

      <header class="hud-top">
        <div class="brand">
          <svg class="brand__mark" width="30" height="30" viewBox="0 0 34 34" aria-hidden="true">
            <circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path
              d="M17 3 20.5 17 17 31 13.5 17Z"
              fill="currentColor"
              fill-opacity=".3"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <path
              d="M3 17 17 13.5 31 17 17 20.5Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
            />
          </svg>
          <div class="brand__text">
            <h1 class="brand__title">Atlas de la Tierra Media</h1>
            <p class="brand__sub">Tercera Edad · 3018–3019 · según los libros</p>
          </div>
        </div>
        <button type="button" class="search-trigger" data-panel-open="search">
          <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <path
              d="m20 20-3.5-3.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span>Busca un lugar, alguien o un suceso</span>
          <kbd>/</kbd>
        </button>
        <div class="books-quick" role="group" aria-label="Filtrar por libro"></div>
        <button
          type="button"
          class="hud-btn"
          data-panel-open="filters"
          aria-label="Filtros y capas"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          >
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
            <circle cx="16" cy="6" r="2" />
            <circle cx="10" cy="12" r="2" />
            <circle cx="18" cy="18" r="2" />
          </svg>
          <span class="hud-btn__label">Filtros</span>
        </button>
        <button
          type="button"
          class="hud-btn hud-btn--gold"
          data-act="share"
          aria-label="Compartir esta vista"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="2.1"
            stroke-linecap="round"
          >
            <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1" />
            <path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" />
          </svg>
          <span class="hud-btn__label">Compartir vista</span>
        </button>
      </header>

      <div class="date-chip" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M6 0 12 6 6 12 0 6Z" fill="currentColor" />
        </svg>
        <span class="date-chip__text"></span>
      </div>

      <div class="cam" role="group" aria-label="Cámara">
        <button type="button" class="cam-btn" data-act="zoom-in" aria-label="Acercar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 5v14M5 12h14"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button type="button" class="cam-btn" data-act="zoom-out" aria-label="Alejar">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button type="button" class="cam-btn" data-act="home" aria-label="Ver todo el mapa">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          >
            <path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z" />
            <path d="M9 4v13.5M15 6.5V20" />
          </svg>
        </button>
        <button type="button" class="cam-btn cam-btn--follow" data-act="follow" aria-pressed="true">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="7" />
            <circle cx="12" cy="12" r="2.2" fill="currentColor" />
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
          </svg>
          <span class="cam-btn__label">Seguir la historia</span>
        </button>
      </div>

      <aside id="company" class="panel panel--company" aria-labelledby="company-title"></aside>
      <aside id="event-card" class="panel panel--event" aria-live="polite"></aside>
      <section id="search" class="panel panel--search" role="dialog" aria-label="Buscar"></section>
      <section
        id="filters"
        class="panel panel--filters"
        role="dialog"
        aria-labelledby="filters-title"
      ></section>

      <section class="dock" aria-label="Línea temporal">
        <div class="dock__grab" aria-hidden="true"></div>
        <button type="button" class="dock__event" data-panel-open="event"></button>
        <div class="player" role="group" aria-label="Reproducción">
          <button
            type="button"
            class="player__btn"
            data-act="prev-event"
            aria-label="Suceso anterior"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor" />
            </svg>
          </button>
          <button
            type="button"
            class="player__play"
            data-act="play"
            aria-label="Reproducir la historia"
          >
            <svg class="i-play" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 4v16l13-8z" fill="currentColor" />
            </svg>
            <svg class="i-pause" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor" />
            </svg>
          </button>
          <button
            type="button"
            class="player__btn"
            data-act="next-event"
            aria-label="Suceso siguiente"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor" />
            </svg>
          </button>
          <div class="speeds" role="group" aria-label="Ritmo">
            <button type="button" data-speed="0">×1</button>
            <button type="button" data-speed="1">×2</button>
            <button type="button" data-speed="2">×4</button>
          </div>
          <div class="player__date">
            <output class="player__day" aria-live="polite"></output>
            <span class="player__ref"></span>
          </div>
          <div class="player__range" hidden>
            <span class="player__range-label"></span>
            <button type="button" class="link-btn" data-act="clear-range">Quitar rango</button>
          </div>
          <div class="player__views" role="group" aria-label="Encuadre de la línea temporal">
            <button type="button" class="chip-btn" data-act="view-focus">3018–3019</button>
            <button type="button" class="chip-btn" data-act="view-all">Todo</button>
          </div>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>

      <nav class="tabs" aria-label="Secciones">
        <button type="button" data-tab="none" aria-current="page">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          >
            <path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20Z" />
            <path d="M9 4v13.5M15 6.5V20" />
          </svg>
          Mapa
        </button>
        <button type="button" data-tab="company">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="9" cy="8" r="3.2" />
            <path d="M3 20c.6-3.4 3-5.3 6-5.3s5.4 1.9 6 5.3" />
            <circle cx="17" cy="9" r="2.5" />
            <path d="M16.5 14.2c2.3.2 4 1.8 4.5 4.8" />
          </svg>
          Compañía
        </button>
        <button type="button" data-tab="event">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <path d="M12 3 21 12 12 21 3 12Z" />
            <path d="M12 8v5M12 16h0" />
          </svg>
          Sucesos
        </button>
        <button type="button" data-tab="search">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            aria-hidden="true"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          Buscar
        </button>
      </nav>

      <div class="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
